<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math 102A 課程數位知識庫 | LLM Wiki</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  
  <!-- KaTeX 數學公式排版 CDN (同步載入確保立即渲染) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Marked Markdown 解析器 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>

  <!-- 知識庫主樣式表 (符合 agent.md 之 Reader-First 與三欄規範) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 閱讀進度條 -->
  <div id="reading-progress"></div>

  <!-- 頂部導覽列 Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="切換目錄">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="#docs/index.md" class="brand-link">
        <div class="brand-icon">M</div>
        <span>Math 102A 知識庫</span>
        <span class="brand-badge">LLM Wiki</span>
      </a>
    </div>

    <div class="header-right">
      <!-- 快速搜尋框 -->
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="搜尋概念或公式..." readonly>
        <span class="search-shortcut">Ctrl K</span>
      </div>

      <!-- 深色/淺色主題切換 -->
      <button class="header-action-btn" id="theme-toggle" aria-label="切換深淺色主題">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>深色</span>
      </button>
    </div>
  </header>

  <!-- 行動裝置遮罩 -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- 標準三欄式主體容器 -->
  <div class="app-container">
    
    <!-- 1. 左側邊欄：樹狀目錄導覽 (Sidebar) -->
    <aside class="app-sidebar" id="app-sidebar">
      <div>
        <div class="sidebar-section-title">課程章節目錄</div>
        <ul class="tree-nav" id="tree-nav">
          <!-- 由 js/app.js 自動動態產生 -->
        </ul>
      </div>
    </aside>

    <!-- 2. 中央主內容區：呈現單一知識點 (Main Content, 70ch~80ch) -->
    <main class="app-content">
      <div class="reading-container">
        <!-- 麵包屑導覽 -->
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="麵包屑導覽">
          <a href="#docs/index.md">知識庫</a>
          <span class="separator">/</span>
          <span>載入中...</span>
        </nav>

        <!-- Frontmatter 元資料卡片 -->
        <div class="note-meta-card" id="note-meta">
          <span class="meta-category">單元概念</span>
          <div class="meta-tags"></div>
        </div>

        <!-- Markdown 與 LaTeX 渲染主體 (內文寬度限制、充足行距) -->
        <article class="markdown-body" id="content-body">
          <div style="text-align: center; padding: 3rem 0; color: var(--text-muted);">
            正在初始化課程知識庫...
          </div>
        </article>

        <!-- 底部上一篇 / 下一篇快速跳轉導覽 -->
        <div class="page-nav-footer" id="page-footer-nav"></div>
      </div>
    </main>

    <!-- 3. 右側大綱與關聯欄 (TOC & Links) -->
    <aside class="app-toc-sidebar" id="app-toc-sidebar">
      
      <!-- 本頁章節目錄 (Table of Contents) -->
      <div>
        <div class="toc-box-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          本頁大綱 (TOC)
        </div>
        <ul class="toc-list" id="toc-list">
          <!-- 由 js/app.js 自動掃描 H2/H3 生成 -->
        </ul>
      </div>

      <!-- 知識點關聯卡 (Prerequisites & Related) -->
      <div class="relation-card">
        <div class="relation-item-group">
          <div class="relation-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 14 4 9 9 4"></polyline>
              <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
            </svg>
            前置知識 (Prerequisites)
          </div>
          <div class="relation-pills" id="prereq-pills"></div>
        </div>

        <div class="relation-item-group">
          <div class="relation-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 10 20 15 15 20"></polyline>
              <path d="M4 4v7a4 4 0 0 0 4 4h12"></path>
            </svg>
            延伸概念 (Related)
          </div>
          <div class="relation-pills" id="related-pills"></div>
        </div>
      </div>

      <!-- 快捷小工具 -->
      <div class="quick-tools">
        <button class="quick-tool-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
          回到頁面頂端
        </button>
        <button class="quick-tool-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('已複製本筆記網址連結！');">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          複製筆記連結
        </button>
      </div>

    </aside>

  </div>

  <!-- 全域搜尋視窗 (Search Modal) -->
  <div class="search-modal" id="search-modal">
    <div class="search-dialog">
      <div class="search-dialog-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-dialog-input" class="search-dialog-input" placeholder="搜尋標題、標籤或單元代號...">
      </div>
      <ul class="search-results-list" id="search-results-list"></ul>
    </div>
  </div>

  <!-- 離線與直接檔案開啟之內建備份腳本 -->
  <script src="js/embedded-data.js"></script>

  <!-- 應用主腳本 -->
  <script src="js/app.js"></script>
</body>
</html>
